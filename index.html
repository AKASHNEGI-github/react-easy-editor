<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="React Easy Editor is a free, MIT-licensed rich text (WYSIWYG) editor for React. Tables, code blocks with syntax highlighting, image upload, Markdown shortcuts, dark mode, five interface languages and TypeScript types. Try it live." />
    <link rel="canonical" href="https://react-easy-editor.netlify.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#e7ecf1" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="React Easy Editor" />
    <meta property="og:title" content="React Easy Editor: a rich text editor for React in one component" />
    <meta property="og:description" content="Tables, code blocks, image upload, Markdown shortcuts, dark mode and five interface languages. Free and MIT licensed. Try it live." />
    <meta property="og:url" content="https://react-easy-editor.netlify.app/" />
    <meta property="og:image" content="https://react-easy-editor.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The React Easy Editor demo: a rich text editor with a full toolbar." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="React Easy Editor: a rich text editor for React" />
    <meta name="twitter:description" content="One component, a full toolbar, no setup. Free and MIT licensed." />
    <meta name="twitter:image" content="https://react-easy-editor.netlify.app/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "React Easy Editor",
        "alternateName": "react-easy-editor",
        "description": "A rich text (WYSIWYG) editor component for React with tables, code blocks, image upload, Markdown shortcuts, dark mode and TypeScript types.",
        "url": "https://react-easy-editor.netlify.app/",
        "codeRepository": "https://github.com/AKASHNEGI-github/react-easy-editor",
        "programmingLanguage": "JavaScript",
        "runtimePlatform": "React",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@type": "Person", "name": "Akash Negi" }
      }
    </script>

    <!-- Apply the saved or system theme before first paint so the page never flashes the wrong one. -->
    <script>
      try {
        var t = localStorage.getItem('ree-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static copy for crawlers and people without JavaScript. React replaces it on load. -->
      <header class="top wrap">
        <span class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="7" fill="#2552c8" /><path d="M6 12h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round" /><rect x="6" y="18" width="14" height="6" rx="1.2" fill="#ffe15a" /><path d="M22 7h5M24.5 7v18M22 25h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none" /></svg>
          react-easy-editor
        </span>
        <nav class="nav">
          <a href="#features">Features</a>
          <a href="https://github.com/AKASHNEGI-github/react-easy-editor">GitHub</a>
          <a href="https://www.npmjs.com/package/react-easy-editor">npm</a>
        </nav>
      </header>
      <main>
        <section class="hero wrap">
          <h1>Rich text editing for React, in one component.</h1>
          <p class="lede">Add <code>&lt;Editor /&gt;</code> and your users get a full toolbar, tables, code blocks, image upload, Markdown shortcuts and dark mode. Nothing to configure, and free under the MIT license.</p>
          <div class="install-row"><div class="install"><code>npm install react-easy-editor</code></div></div>
        </section>
        <noscript><p class="wrap">The live demo needs JavaScript. The full list of features is below.</p></noscript>
        <!--features-->
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
